function story() {
    var main = document.getElementById('main');
    if (t <= 0) {
        t += 1;

    }
    var last = document.createElement('div');

    var valHajime = choose(aaList);

    if (aaList.includes(valHajime)) {
        var fElement = document.createElement('f');
        fElement.textContent = valHajime;
        last.appendChild(fElement);
        last.appendChild(document.createElement('br'));
    } else {
        last.appendChild(document.createTextNode(valHajime));
        last.appendChild(document.createElement('br'));
    }

    main.appendChild(last);
}

async function init() {
    function splitSprite(text, linesPerSprite) {
        const lines = text.trim().split("\n");
        const sprites = [];

        for (let i = 0; i < lines.length; i += linesPerSprite) {
            sprites.push(lines.slice(i, i + linesPerSprite).join("\n"));
        }
        return sprites;
    }

    const res = await fetch("aa-template1.txt");
    const text = await res.text();

    aaList = splitSprite(text, 135);

    story();

    setInterval(() => {
        count++;
        story();
    }, 42);
