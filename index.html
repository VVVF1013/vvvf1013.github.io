    <script type="text/javascript">

        

        const ua = navigator.userAgent;
        let currentIndex = 0;
        let aaList = [];

        window.addEventListener("DOMContentLoaded", () => {
            const ua = navigator.userAgent;

            if (ua.includes("Windows")) {
                document.body.classList.add("windows");
            }
            else if (ua.includes("Mac")) {
                document.body.classList.add("mac");
            }
            else {
                document.body.classList.add("other");
            }
        });

        var screenWidth  = screen.width,
            screenHeight = screen.height;

        var AA1 = "";

        var t = 0;
        var count = 0;

        var hajime = [ 
            ];
        var doushi = [
            
        ];
        var owari = [
            
            ];
        var shugo = [ ];
        var mokutekigo = [];
        function rand_range(max) {
            return Math.floor(Math.random() * (max + 1));
        }

        function choose() {
            const text = hajime[currentIndex];
            currentIndex = (currentIndex + 1) % hajime.length;
            return text;
        }

        function story() {
            var main = document.getElementById('main');
            if (t <= 0) {
                t += 1;
            } else {
                main.removeChild(document.getElementById('main').firstChild);
            }
            var last = document.createElement('div');
            last.appendChild(document.createElement('br'));
            
            

            var valHajime;

            if (aaList.includes(valHajime)) {
                var fElement = document.createElement('f');
                fElement.textContent = valHajime; 
                last.appendChild(fElement);
                last.appendChild(document.createElement('br'));
            } else {
        
                last.appendChild(document.createTextNode(valHajime));
                last.appendChild(document.createElement('br'));
            }

            
            main.appendChild(last);
        }

        

            function init() {
                function splitSprite(templateId, linesPerSprite) {
                    const template = document.getElementById(templateId);

                    // 文章を行単位に分割
                    const lines = template.textContent.trim().split("\n");

                    const sprites = [];

                    // 指定行数ごとに分割
                    for (let i = 0; i < lines.length; i += linesPerSprite) {
                        sprites.push(
                            lines.slice(i, i + linesPerSprite).join("\n")
                    );
                    }

                    return sprites;
                }

                aaList = splitSprite("aa-template1", 112);

                valHajime = choose(aaList);

                story();

                setInterval(() => {
                    count++;
                    story();
                }, 41);

            }
